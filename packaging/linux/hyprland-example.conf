#
# OpenRamble without the `input` group: let the compositor drive the dictation key.
# ---------------------------------------------------------------------------------
#
# The normal path reads /dev/input directly, which needs `sudo gpasswd -a "$USER" input`
# and a fresh login. Where that is not on offer, Hyprland already sees every key and can
# run a command on its edges. OpenRamble listens on a Unix socket for exactly two of them:
#
#     $XDG_RUNTIME_DIR/openramble/ctl.sock
#
#     hotkey press     -> ok down    the key went down: dictation starts
#     hotkey release   -> ok up      the key came up: dictation stops and the text is inserted
#     hotkey toggle    -> ok down|up whichever edge the key was not already at
#     status           -> ok state=Idle key=RightCtrl down=false
#
# Copy the block you want into ~/.config/hypr/hyprland.conf (or your Lua config) and
# reload with `hyprctl reload`. Nothing here needs OpenRamble to be restarted, and nothing
# here disables the /dev/input path - see "Both at once" at the bottom.
#
# Everything below is documentation and a wiki reading. It has NOT been tested against a
# running compositor by the people who wrote it; each claim is marked [wiki] where
# https://wiki.hypr.land says it in so many words, and [untested] where it is read off
# Hyprland's source and should be confirmed on your own machine with `hyprctl reload`
# and a `status` command.
#
# Hyprland 0.55 deprecated the hyprlang config in favour of Lua. Both spellings are given:
# the hyprlang one still parses in 0.56 and is what the archived
# https://wiki.hypr.land/0.54.0/Configuring/Binds/ documents; the Lua one follows
# https://wiki.hypr.land/Configuring/Basics/Binds/. `hyprctl status` prints which provider
# you are on.
#

# --- The client -------------------------------------------------------------------------
#
# Two ways to say one line into the socket. Use socat.
#
#   socat        ~1 ms per call, measured. This is what the binds below use.
#   nc -U -N     ~1 ms as well, if your netcat is the OpenBSD one. The -N matters: without
#                it netcat waits for its own idle timeout after the reply and the release
#                edge arrives a whole second late.
#   OpenRamble.App.Linux ctl hotkey press
#                ~20 ms, measured warm on the machine this was written on - a whole .NET
#                process start for one line. Fine for the press edge and fine for a toggle;
#                on the release edge it is 20 ms added to the wait between letting the key
#                go and seeing the text, which is the one delay in this product a person
#                actually feels. It is there so the feature works with nothing installed.
#
# [wiki] "Keybind handlers must not block. ... Prefer hl.dsp.exec_cmd(...) for external
# commands so they run outside the bind callback." So: exec, never an inline reader.
#
# [wiki] "Binds use commas as argument separators. The bind keyword expects exactly 4
# arguments, so you need exactly 3 commas" - and "An accidental trailing comma becomes part
# of the argument". None of the commands below contain a comma. Keep it that way.

# hyprlang: a variable so the socket path is written once. The shell does the expanding of
# $XDG_RUNTIME_DIR, inside single quotes, so that hyprlang does not try to.
$ORCTL = socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/openramble/ctl.sock


# --- Style 1: hold to dictate (two binds) -------------------------------------------------
#
# The real thing: hold Right Ctrl, speak, let go. Needs both edges.
#
# The `n` flag on both is not optional. [wiki] n = "Key/mouse events will be passed to the
# active window in addition to triggering the dispatcher." Without it Hyprland eats the key
# and applications stop seeing Right Ctrl at all - so Ctrl+C would break while OpenRamble is
# running. The /dev/input path never swallows the key either; `n` keeps the two paths
# behaving the same.
#
# The two lines are asymmetric, and that is the whole subtlety of binding a bare modifier:
#
#   press   - no modmask. At the moment Control_R goes down, Hyprland has not yet folded it
#             into the modifier mask, so the bind that matches is the one with an empty
#             modmask. [untested] The wiki does not discuss press-edge modifier binds at
#             all; this is read from Hyprland's source (the key event is emitted before the
#             xkb state is updated). If the press bind does not fire on your machine, you
#             cannot have hold mode - use Style 2.
#
#   release - modmask CTRL. By the time Control_R comes up the mask does contain CTRL, so an
#             empty modmask does not match and the target one does. [wiki] "To only bind
#             modkeys, you need to use the TARGET modmask (with the activating mod) and the
#             `r` flag, e.g.: bindr = SUPER ALT, Alt_L, exec, amongus".
#
# [untested] `bindrn` combines `r` and `n`. The wiki shows flags combining (`bindrl`) but
# never states that any order or pair is allowed; Hyprland's parser reads the letters in a
# loop and rejects only e+r, e+o, m+e/r/l and c+g, so rn is fine and nr is the same thing.

bindn  = , Control_R, exec, sh -c 'echo hotkey press | $ORCTL'
bindrn = CTRL, Control_R, exec, sh -c 'echo hotkey release | $ORCTL'

# Caveat worth knowing before you keep this: an empty-modmask press bind fires every time
# Control_R goes down with nothing else held - including when you are on your way to
# Ctrl+Shift+something. OpenRamble handles that case itself (a foreign key pressed during a
# hold aborts the dictation without inserting), so the cost is a microphone that opens for
# a moment. If that bothers you, Style 2 does not have the problem.


# --- Style 2: toggle (one bind) ------------------------------------------------------------
#
# Tap to start, tap to stop. One bind, on the edge the wiki documents, so this is the style
# to use if Style 1's press bind turns out not to fire for a bare modifier on your version.
# Comment out Style 1 before enabling this - two binds on one key means two commands.
#
# `toggle` asks OpenRamble where the key currently is and sends the other edge, so the two
# taps cannot get out of step with each other even if one of them is lost.

# bindrn = CTRL, Control_R, exec, sh -c 'echo hotkey toggle | $ORCTL'

# What you give up with toggle: nothing about the dictation itself - it is the same press
# and the same release through the same machinery. What changes is the gesture. Hold mode
# ends when you let go; toggle mode runs until you tap again, so a tap that goes missing
# leaves the microphone open until the next one. `status` will say so: down=true.


# --- Style 3: a key that is not a modifier at all -------------------------------------------
#
# If the picker's Caps Lock is what you chose, the bare-modifier problem does not arise -
# Caps Lock is not a modifier in the modmask sense - and both edges bind with no modmask.
# [untested] as above.

# bindn  = , Caps_Lock, exec, sh -c 'echo hotkey press | $ORCTL'
# bindrn = , Caps_Lock, exec, sh -c 'echo hotkey release | $ORCTL'

# Caps Lock keeps shouting, and a bind does not stop it. [untested, and it contradicts a
# reasonable guess:] consuming the key stops it reaching the application, but Hyprland
# updates the xkb lock state and the keyboard LED before and independently of any bind
# decision, so the light still toggles with every dictation. The compositor CAN silence it -
# but with the layout, not with a bind. [wiki] "You can customize the behavior of the Caps
# Lock key using kb_options":
#
#     input {
#         kb_options = caps:none      # Caps Lock does nothing at all - and still binds
#     }
#
# That is the one thing the /dev/input path genuinely cannot do: reading a device cannot
# unshout a key, and the alternative there (EVIOCGRAB) takes the whole keyboard away from
# the desktop. See docs/differences-from-macos.md.


# --- The Lua spelling (Hyprland >= 0.55) ------------------------------------------------------
#
# The same two binds, transcribed from https://wiki.hypr.land/Configuring/Basics/Binds/.
# [untested] here, like everything above.
#
#     local sock = os.getenv("XDG_RUNTIME_DIR") .. "/openramble/ctl.sock"
#     local function ctl(line)
#         return hl.dsp.exec_cmd("sh -c 'echo " .. line .. " | socat -t1 - UNIX-CONNECT:" .. sock .. "'")
#     end
#
#     -- hold: press with no modmask, release with the target modmask
#     hl.bind("Control_R",         ctl("hotkey press"),   { non_consuming = true })
#     hl.bind("CTRL + Control_R",  ctl("hotkey release"), { release = true, non_consuming = true })
#
#     -- or toggle, one bind
#     -- hl.bind("CTRL + Control_R", ctl("hotkey toggle"), { release = true, non_consuming = true })
#
# On a Lua config `hyprctl keyword` does not work; `hyprctl eval 'hl.bind(...)'` is the
# dynamic equivalent, and `hyprctl reload` re-reads the file.


# --- Checking it -------------------------------------------------------------------------------
#
#   echo status | socat -t1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/openramble/ctl.sock
#       -> ok state=Idle key=RightCtrl down=false
#
# If that answers, the socket is fine and anything still wrong is the bind. Run OpenRamble
# with a diagnostic log - OPENRAMBLE_DIAG=/tmp/openramble.log - and watch for:
#
#   hotkey.edge key=RightCtrl down=true source=ctl
#   hotkey.gesture kind=Press delay_ms=0
#
# `source=ctl` is the compositor; `source=evdev` is a keyboard being read directly. Which
# one you see tells you which path actually delivered the key.
#
# Make sure the key named in the bind is the key chosen in OpenRamble's settings. The socket
# always drives the *configured* hotkey - there is no way to ask it for a different one - so
# a bind on Control_R while the app is set to Caps Lock still starts a dictation, which is
# confusing rather than broken.


# --- The dictation panel must not take the keyboard -------------------------------------------
#
# When words could not be pasted they wait on the panel, and tapping the dictation key pastes
# them again into the window in front. If clicking the panel gives it the keyboard, that
# paste lands in the panel; the panel's own button therefore only copies. To keep focus where
# you were typing, tell Hyprland never to focus the panel. Its title is "OpenRamble
# dictation" (check yours with `hyprctl clients`). [untested] - the rule syntax changed
# across Hyprland releases; the first form is 0.48-0.52, the second 0.53+.
#
# windowrule = nofocus, title:^(OpenRamble dictation)$
# windowrule = match:title ^(OpenRamble dictation)$, no_focus on


# --- Both at once --------------------------------------------------------------------------------
#
# The socket does not replace the /dev/input path; both are live whenever the app is running.
# On a machine where the group is missing that is free, because only one of them can deliver
# anything. On a machine where you ARE in the `input` group, do not bind the same key here:
# both sources move one shared key state, so the dictation ends at whichever edge arrives
# first. Holding the key and having the compositor's release bind fire ends the dictation
# under your finger; the physical release that follows finds the key already up and does
# nothing. Nothing hangs and nothing is lost - it is just two hands on one switch.
